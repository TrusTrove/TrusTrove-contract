# Cargo dependency policy for the Soroban Rust workspace (issue #1025).
#
# Enforced in CI by `cargo deny check` (see .github/workflows/ci.yml).
# Every check runs deny-by-default: an advisory, license, banned crate or
# source that is not explicitly allowed below fails the build.
#
# Sections and keys follow the cargo-deny configuration schema:
# https://embarkstudios.github.io/cargo-deny/

[advisories]
# All RUSTSEC advisories are denied unless explicitly ignored here.
# RUSTSEC-2026-0009 (time DoS) no longer applies: the lockfile resolves
# time 0.3.54, which is past the fixed 0.3.47.
ignore = [
  # paste is an unmaintained proc-macro crate pulled in transitively by the
  # Soroban VM dependency tree. It has no known vulnerability; there is no
  # upstream replacement available to this workspace, and upgrading is gated
  # on soroban-sdk.
  { id = "RUSTSEC-2024-0436", reason = "transitive via soroban-sdk; unmaintained, not vulnerable" },
  # derivative is an unmaintained derive helper reached only through
  # soroban-env-host 23.0.1 -> ark-ff / ark-ec 0.4.2. RUSTSEC-2024-0388 states
  # explicitly that no safe upgrade is available (upstream is archived), so the
  # only route out is an upstream ark-* release picked up by soroban-env-host.
  { id = "RUSTSEC-2024-0388", reason = "transitive via soroban-env-host 23.0.1 -> ark-ff/ark-ec; no fixed version exists" },
  # crypto-bigint 0.5.5 is reached only through soroban-env-host 23.0.1 ->
  # k256 0.13.4 -> elliptic-curve 0.13.8. env-host is a native test/CI
  # dependency and is not part of the deployed wasm contracts. The advisory's
  # fix is crypto-bigint >=0.7.6, which requires k256 0.14; env-host 23.0.1
  # pins k256 ^0.13.3, so no compatible upgrade exists until an upstream
  # soroban-env-host release moves that pin. Revisit on the next SDK bump.
  { id = "RUSTSEC-2026-0387", reason = "transitive via soroban-env-host 23.0.1 -> k256 0.13.4; native test-only, no 0.5.x fix" },
]

[licenses]
# A dependency is accepted when one of its licenses appears here; anything
# else fails the check. The current graph (184 registry crates) resolves to
# MIT, Apache-2.0, Apache-2.0 WITH LLVM-exception, BSD-2-Clause,
# BSD-3-Clause, Zlib, Unicode-3.0, 0BSD or Unlicense, including the legacy
# "MIT/Apache-2.0" expression form.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Zlib",
  "Unicode-3.0",
  "0BSD",
  "Unlicense",
]
confidence-threshold = 0.8

[bans]
# Fail if two versions of the same third-party crate ever enter the graph.
# Kept as a hard gate: the entries below are the complete, justified set of
# duplicates the soroban-sdk 21 -> 23 upgrade cannot unify, so anything new
# still fails.
multiple-versions = "deny"
# Transitive duplicates that cannot be unified without an upstream release.
skip = [
  # soroban-sdk -> bytes-lit still requires syn 2, while a newer dependency
  # tree resolves syn 3. Both are proc-macro-only builds.
  { crate = "syn@2.0.117", reason = "pinned by bytes-lit via soroban-sdk; syn 3 is also in the graph" },
  # ark-ff-asm 0.4.2 (via soroban-env-host 23.0.1) is still on syn 1.
  { crate = "syn@1.0.109", reason = "pinned by ark-ff-asm 0.4.2 via soroban-env-host; proc-macro only" },
  # soroban-sdk-macros 23.5.3 pins darling 0.20 while serde_with 3.17 (also
  # pulled in by soroban-sdk) resolves darling 0.21. darling_core and
  # darling_macro follow the same split as their parent.
  { crate = "darling@0.20.11", reason = "pinned by soroban-sdk-macros 23.5.3; serde_with 3.17 requires 0.21" },
  { crate = "darling_core@0.20.11", reason = "same darling 0.20/0.21 split as darling" },
  { crate = "darling_macro@0.20.11", reason = "same darling 0.20/0.21 split as darling" },
  # ark-ec 0.4.2 (via soroban-env-host 23.0.1) is on hashbrown 0.13 while the
  # rest of the graph resolves 0.14.
  { crate = "hashbrown@0.13.2", reason = "pinned by ark-ec 0.4.2 via soroban-env-host; 0.14 is also in the graph" },
  # soroban-env-host and stellar-xdr 23.0 pin stellar-strkey 0.0.13 while
  # soroban-sdk 23.5.3 moved to 0.0.16; unifying requires an env-host release.
  { crate = "stellar-strkey@0.0.13", reason = "pinned by soroban-env-host + stellar-xdr 23.0; soroban-sdk 23.5.3 uses 0.0.16" },
]
# Wildcard requirements are allowed only because every workspace crate is
# referenced by path with no version requirement (`{ path = "../pause" }` or
# `{ workspace = true }`), which cargo-deny reports as `*`. First-party
# crates are versioned together by the workspace manifest.
wildcards = "allow"

[sources]
# Only the crates.io registry (plus in-workspace path dependencies) may be
# used; git and alternative-registry sources are rejected.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
