[package]
name = "trusttrove-invoice"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
trusttrove-registry = { path = "../registry" }
trusttrove-escrow = { path = "../escrow" }
trusttrove-pool = { path = "../pool" }

[features]
testutils = ["soroban-sdk/testutils"]
