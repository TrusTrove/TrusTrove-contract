name: CI

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Issue #804: lint this workflow file (and every other workflow) so a
      # malformed step, invalid action pin, or unreachable `if:` surfaces here
      # instead of breaking a real run. Runs before the Rust setup because it
      # needs no toolchain, so syntax errors fail fast and cheap.
      - name: Install actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.11
          ./actionlint -version
        shell: bash

      - name: Lint workflow files
        run: ./actionlint -color
        shell: bash

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.85.0
          targets: wasm32v1-none
          components: clippy, rustfmt

      - name: Ensure wasm32v1-none target
        run: rustup target add wasm32v1-none --toolchain 1.85.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.1

      - name: Audit dependencies (RUSTSEC)
        run: cargo audit

      - name: Check prohibited production panic calls
        run: python3 scripts/check_production_panic_calls.py

      - name: Test production panic checker
        run: python3 -m unittest discover -s scripts -p 'test_check_production_panic_calls.py'

      - name: Check generated contract API documentation
        run: python3 scripts/generate_contract_api.py --check

      - name: Test contract API generator
        run: python3 -m unittest discover -s scripts -p 'test_generate_contract_api.py'

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --workspace

      - name: Build wasm (release)
        run: cargo build --workspace --release --target wasm32v1-none

      - name: Test (default features)
        run: cargo test --workspace

      - name: Test (all features)
        run: cargo test --workspace --all-features

      - name: Build documentation (warnings as errors)
        run: cargo doc --workspace --no-deps --all-features

      - name: Check wasm size budget
        run: |
          echo "=== WASM Size Report ==="
          ls -lh target/wasm32v1-none/release/*.wasm 2>/dev/null || true
          echo ""
          echo "Checking against budget..."
          REGISTRY=$(wc -c < target/wasm32v1-none/release/trusttrove_registry.wasm 2>/dev/null || echo 0)
          INVOICE=$(wc -c < target/wasm32v1-none/release/trusttrove_invoice.wasm 2>/dev/null || echo 0)
          ESCROW=$(wc -c < target/wasm32v1-none/release/trusttrove_escrow.wasm 2>/dev/null || echo 0)
          POOL=$(wc -c < target/wasm32v1-none/release/trusttrove_pool.wasm 2>/dev/null || echo 0)

          # Budget in bytes (adjust as needed; Soroban charges by size)
          REGISTRY_BUDGET=1048576  # 1 MB
          INVOICE_BUDGET=2097152   # 2 MB
          ESCROW_BUDGET=1048576    # 1 MB
          POOL_BUDGET=2097152      # 2 MB

          echo "registry:    $REGISTRY bytes (budget: $REGISTRY_BUDGET)"
          echo "invoice:     $INVOICE bytes (budget: $INVOICE_BUDGET)"
          echo "escrow:      $ESCROW bytes (budget: $ESCROW_BUDGET)"
          echo "pool:        $POOL bytes (budget: $POOL_BUDGET)"

          [ "$REGISTRY" -le "$REGISTRY_BUDGET" ] || exit 1
          [ "$INVOICE" -le "$INVOICE_BUDGET" ] || exit 1
          [ "$ESCROW" -le "$ESCROW_BUDGET" ] || exit 1
          [ "$POOL" -le "$POOL_BUDGET" ] || exit 1

  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    env:
      # Exposed as env so the upload step can be skipped when the secret is
      # absent (forks, or before the repo is onboarded to Codecov) — the
      # secrets context is not available in a step-level `if`.
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.85.0
          components: llvm-tools-preview

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: coverage

      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-tarpaulin@0.32.7

      - name: Run coverage
        run: |
          cargo tarpaulin --workspace \
            --engine llvm \
            --out lcov --out html --out xml \
            --output-dir coverage \
            --timeout 300

      - name: Upload coverage report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload coverage to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/cobertura.xml
          fail_ci_if_error: true

  integration-test:
    name: integration-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.85.0
          targets: wasm32v1-none
          components: clippy, rustfmt

      - name: Ensure wasm32v1-none target
        run: rustup target add wasm32v1-none --toolchain 1.85.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: integration-test

      - name: Run cross-contract integration tests
        run: cargo test -p trusttrove-integration-tests -- --nocapture

